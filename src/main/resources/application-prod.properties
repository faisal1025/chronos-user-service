spring.application.name=UserService
server.port=${APP_PORT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# driver is a tool for converting in a language mysql understand
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
# dialect is a language
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# --- Kafka ---
# Spring Kafka (spring-kafka) configuration
# Mapped from existing Kafka keys above so spring-kafka/spring-boot can auto-configure clients
# Uses placeholders to reuse the values already defined in this file (bootstrap.servers, sasl.jaas.config, etc.)
spring.kafka.bootstrap-servers=${KAFKA_SERVER}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=auth-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.chronos.UserService.entity
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG}
spring.kafka.properties.session.timeout.ms=${session.timeout.ms:45000}

# Producer-specific settings
spring.kafka.producer.acks=all
spring.kafka.producer.client-id=user-service

# Shared Kafka client properties (security, SASL, DNS lookup, timeouts)
spring.kafka.properties.client.dns.lookup=use_all_dns_ips

# jwt properties
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration-ms=${JWT_EXPIRATION}

#Actuator
management.endpoint.health.show-data=active
management.endpoint.web.exposure.include=*

#server-url=http://ec2-13-127-226-199.ap-south-1.compute.amazonaws.com/
springdoc.swagger-ui.path=/docs